name: release

# Publishes the container image users actually deploy
# (docs/52-DEPLOYMENT-GUIDE.md, docs/48-DEPLOYMENT-PROFILES.md).
#
# Triggered by a version tag. Nothing publishes from `main` — a mutable
# `:latest` that moves on every merge is how a self-hoster ends up running a
# commit nobody released.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — does not publish)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write        # keyless signing
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # A release must pass everything a PR passes. A security fix ships out of
  # band, but it does not ship past the gates (docs/07 §Security baseline).
  gates:
    uses: ./.github/workflows/ci.yml

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Known deployment blockers are closed
        run: python3 scripts/check-release-readiness.py

  publish:
    needs: [gates, release-readiness]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # `latest` moves only on a real, non-prerelease version tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=TaskForge
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters here: self-hosters run this on Apple silicon and on
          # ARM VPS instances, which are the cheapest way to host it.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true          # docs/07 — SBOM published per release

      - name: Image size within budget (docs/30 — under 100 MB)
        if: github.event_name == 'push'
        run: |
          docker pull "${{ env.REGISTRY }}/${{ env.IMAGE }}:${GITHUB_REF_NAME#v}"
          BYTES=$(docker image inspect "${{ env.REGISTRY }}/${{ env.IMAGE }}:${GITHUB_REF_NAME#v}" -f '{{.Size}}')
          MB=$((BYTES / 1000000))
          echo "published image: ${MB} MB"
          [ "$MB" -le 100 ] || { echo "image exceeds the 100 MB budget" >&2; exit 1; }

      - name: Attest provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Proves the PUBLISHED artifact deploys — not the one built locally. A release
  # that passes CI and then fails on a self-hoster's machine is the failure this
  # job exists to prevent.
  verify-published:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the published image and assert it is secure
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s|^TASKFORGE_IMAGE=.*|TASKFORGE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE }}:${VERSION}|" \
            deploy/.env.example
          ./scripts/verify-deployment.sh
