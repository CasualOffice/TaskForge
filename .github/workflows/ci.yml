name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable from release.yml so a release runs the identical gate set rather
  # than a parallel copy that can drift (docs/15).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Job names are the CI contract; see docs/15-CI-AND-RELEASE-GATES.md.
#
# Gates whose harnesses do not exist yet are recorded in that document's
# "Pending gates" section and are added by their own tracker items — latency
# (F-007, waiting on a baseline measured on the docs/30 reference machine),
# openapi-diff and error-registry (Phase 1), a11y (C-019), fuzz (Phase 1).
# A gate is never silently omitted; it is either here or recorded as pending.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The layer division from docs/19, enforced. An illegal dependency, SQL
  # outside casual-task-persistence, HTTP outside casual-task-api, OFFSET, an
  # unbounded channel, or an AuthContext minted outside the API edge all fail
  # the build here rather than in review.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -q -p casual-task-lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-features --locked

  # Applies every migration to a clean PostgreSQL 16 and asserts the schema
  # invariants — including tenant isolation and append-only history, which are
  # verified as the NON-SUPERUSER application role because neither guarantee
  # holds for a superuser (migration 0012, docs/32).
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: tf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TF_VERIFY_DSN: postgres://tf:tf@127.0.0.1:5432/tf
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-schema.sh

  # docs/26 NFR-5 / ADR-011: no user-reachable query performs a sequential scan
  # on a tenant-scale table. Every query in tests/explain/queries/ is planned as
  # the NON-SUPERUSER taskforge_app role, because the RLS predicate migration
  # 0010 attaches is a stable expression the planner cannot fold and it competes
  # with the query's own quals for the index — planning as the owner would gate
  # a query the product never issues.
  #
  # The corpus is tests/explain/seed.sql (~109k tasks), not the docs/30
  # reference corpus: reference is ~10.5 GiB of COPY text before indexes (
  # measured, see benchmarks/README.md) and does not fit a hosted runner, and
  # docs/30 §Measurement is explicit that "PR runs use a reduced corpus for
  # signal". This proves plan SHAPE; latency is F-007's job.
  #
  # No --allow-skip: an empty corpus is the dangerous case, because every
  # assertion passes against a zero-page relation. The script exits 2 rather
  # than report a guarantee nobody has.
  explain-no-seq-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: tf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TF_VERIFY_DSN: postgres://tf:tf@127.0.0.1:5432/tf
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-queries.sh

  # ADR-024's initial-chunk budget, measured rather than asserted. The gate is a
  # separate process from the build on purpose (webapp/scripts/size-check.mjs):
  # it can run against a downloaded artifact and cannot be defeated by a
  # build-time flag. It fails on a MISSING measurement instead of treating one
  # as a pass, which is the failure mode a bundle budget usually dies of.
  #
  # The lockfile is frozen because webapp/BUNDLE-FLOOR.md measured the floor
  # moving 4.4% on a bundler major with no source change. A gate that fails a PR
  # must not be that sensitive to an unrelated dependency bump.
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types resolve
        run: pnpm typecheck
      - run: pnpm build
      - name: Initial chunk within the ADR-024 budget
        # Units are KiB. ADR-024 says "200 KB" without saying which, and the two
        # readings differ by 4.7 KiB — 2.3% of the budget, enough to decide a
        # borderline PR — so the gate states its unit rather than assuming one.
        run: pnpm size-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: webapp/dist/bundle-report.json

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: cargo doc --workspace --all-features --no-deps

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --locked
      - run: cargo deny check bans licenses sources

  # docs/16-DOCUMENTATION-MAINTENANCE.md — the design record is the source of
  # truth, so a broken cross-reference is a build failure.
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Internal documentation links resolve
        run: python3 scripts/check-doc-links.py
      - name: Reject merge-conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- ':!*.yml' ; then
            echo "merge-conflict markers found" >&2
            exit 1
          fi
      - name: Reject banned words in docs
        run: |
          # docs/16 §Writing standards — each hides an unverified claim.
          # The three docs that *define* the ban are excluded, as is the
          # archive, which is preserved verbatim for provenance.
          if git grep -nEi '\b(seamless|lossless)\b' -- 'docs/*.md' \
               ':!docs/10-PROJECT-GOAL-AND-STANDARDS.md' \
               ':!docs/16-DOCUMENTATION-MAINTENANCE.md' \
               ':!docs/17-GLOSSARY.md' \
               ':!docs/_archive/*' ; then
            echo "banned word in docs (docs/16 §Writing standards)" >&2
            exit 1
          fi

  # The deployable artifact. Built on every PR so a Dockerfile or dependency
  # change cannot rot unnoticed, and so the image size stays visible against the
  # <100 MB target (docs/30). Publishing happens on release, not here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t taskforge:ci .
      - name: Binaries run, migrations shipped, non-root
        run: |
          docker run --rm --entrypoint /usr/local/bin/taskforge-api    taskforge:ci
          docker run --rm --entrypoint /usr/local/bin/taskforge-worker taskforge:ci
          test "$(docker inspect -f '{{.Config.User}}' taskforge:ci)" = "65532:65532"
          docker run --rm --entrypoint /usr/local/bin/taskforge-api taskforge:ci --help >/dev/null 2>&1 || true
      - name: Image size within budget (docs/30 — under 100 MB)
        run: |
          BYTES=$(docker image inspect taskforge:ci -f '{{.Size}}')
          MB=$((BYTES / 1000000))
          echo "image size: ${MB} MB"
          if [ "$MB" -gt 100 ]; then echo "image exceeds the 100 MB budget" >&2; exit 1; fi
      - name: Deployment compose files are valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config >/dev/null
          docker compose -f docker-compose.yml config >/dev/null
          rm deploy/.env
      - name: Deployment is actually secure end-to-end
        # Brings up the deployment compose and asserts the application role is
        # created NOSUPERUSER/NOBYPASSRLS, RLS covers every tenant table, an
        # unscoped connection sees nothing, and audit history rejects UPDATE.
        # These failures are silent in production, which is why they are gated.
        run: ./scripts/verify-deployment.sh

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: "1.96.0"
          - os: ubuntu-latest
            toolchain: "1.90.0"   # MSRV check (ADR-pending, D-032)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: rustup override set ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-features --locked
