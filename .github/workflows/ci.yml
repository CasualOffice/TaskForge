name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable from release.yml so a release runs the identical gate set rather
  # than a parallel copy that can drift (docs/15).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Job names are the CI contract; see docs/15-CI-AND-RELEASE-GATES.md.
#
# Gates whose harnesses do not exist yet are recorded in that document's
# "Pending gates" section and are added by their own tracker items — latency
# (F-007, waiting on a baseline measured on the docs/30 reference machine),
# openapi-diff and error-registry (Phase 1), a11y (C-019), fuzz (Phase 1).
# A gate is never silently omitted; it is either here or recorded as pending.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The layer division from docs/19, enforced. An illegal dependency, SQL
  # outside casual-task-persistence, HTTP outside casual-task-api, OFFSET, an
  # unbounded channel, or an AuthContext minted outside the API edge all fail
  # the build here rather than in review.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -q -p casual-task-lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-features --locked

  # Applies every migration to a clean PostgreSQL 16 and asserts the schema
  # invariants — including tenant isolation and append-only history, which are
  # verified as the NON-SUPERUSER application role because neither guarantee
  # holds for a superuser (migration 0012, docs/32).
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: tf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TF_VERIFY_DSN: postgres://tf:tf@127.0.0.1:5432/tf
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-schema.sh

      # docs/50's queries are read once, during an incident, by someone under
      # time pressure who cannot tell a stale query from a correct one until it
      # errors. Migration 0013 dropped three columns that every query in RB-01
      # and RB-02 used; both runbooks were silently broken and were fixed by
      # someone noticing. This is so the next one is noticed here.
      - name: Runbook queries still run against the schema (F-014)
        run: ./scripts/verify-runbooks.sh

      # The Rust side of the same ground (F-005). verify-schema.sh above is the
      # gate and stays the gate; this proves the testcontainers harness Phase 1
      # will build its repository tests on still starts a PostgreSQL 16, applies
      # every migration, and can reach the invariants from Rust. It is #[ignore]
      # by default so `cargo test` stays runnable without a Docker daemon, which
      # means CI is the only place it runs — so CI has to run it, or it rots.
      - name: Every Docker-backed suite (F-005, C-005, C-011)
        # --workspace, not -p: the same argument that made this "every ignored
        # test in the crate rather than one named file" applies a level up. The
        # C-011 acceptance gate lives in casual-task-worker, and pinning this to
        # one crate meant a new crate's suites would be written, pass locally,
        # and never run here — which is the only place they run at all.
        run: cargo test --workspace -- --ignored

  # docs/26 NFR-5 / ADR-011: no user-reachable query performs a sequential scan
  # on a tenant-scale table. Every query in tests/explain/queries/ is planned as
  # the NON-SUPERUSER taskforge_app role, because the RLS predicate migration
  # 0010 attaches is a stable expression the planner cannot fold and it competes
  # with the query's own quals for the index — planning as the owner would gate
  # a query the product never issues.
  #
  # The corpus is tests/explain/seed.sql (~109k tasks), not the docs/30
  # reference corpus: reference is ~10.5 GiB of COPY text before indexes (
  # measured, see benchmarks/README.md) and does not fit a hosted runner, and
  # docs/30 §Measurement is explicit that "PR runs use a reduced corpus for
  # signal". This proves plan SHAPE; latency is F-007's job.
  #
  # No --allow-skip: an empty corpus is the dangerous case, because every
  # assertion passes against a zero-page relation. The script exits 2 rather
  # than report a guarantee nobody has.
  explain-no-seq-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: tf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TF_VERIFY_DSN: postgres://tf:tf@127.0.0.1:5432/tf
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-queries.sh

  # ADR-024's initial-chunk budget, measured rather than asserted. The gate is a
  # separate process from the build on purpose (webapp/scripts/size-check.mjs):
  # it can run against a downloaded artifact and cannot be defeated by a
  # build-time flag. It fails on a MISSING measurement instead of treating one
  # as a pass, which is the failure mode a bundle budget usually dies of.
  #
  # The lockfile is frozen because webapp/BUNDLE-FLOOR.md measured the floor
  # moving 4.4% on a bundler major with no source change. A gate that fails a PR
  # must not be that sensitive to an unrelated dependency bump.
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types resolve
        run: pnpm typecheck
      - run: pnpm build
      - name: Initial chunk within the ADR-024 budget
        # Units are KiB. ADR-024 says "200 KB" without saying which, and the two
        # readings differ by 4.7 KiB — 2.3% of the budget, enough to decide a
        # borderline PR — so the gate states its unit rather than assuming one.
        run: pnpm size-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: webapp/dist/bundle-report.json

  # C-019. Its own job, not extra steps inside `bundle-size`: an accessibility
  # failure reported as "bundle-size failed" is a failure nobody reads correctly,
  # and the two gates answer different questions.
  #
  # Two layers, and the third is a human. `lint` reads the SOURCE — a control
  # with no accessible name, a click handler on a div, an aria-* that does not
  # exist. `test` runs axe over the RENDERED DOM, which is where a dangling
  # aria-labelledby and a duplicate id live.
  #
  # Neither checks CONTRAST. jsdom has no layout, so axe's color-contrast rule
  # cannot run, and docs/42's "4.5:1, verified in light and dark" is still a
  # manual check. webapp/src/a11y.test.tsx says so in its own header rather than
  # letting a green tick imply otherwise, and docs/15 keeps the Playwright row
  # open.
  frontend-a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Source-level accessibility and hook rules
        run: pnpm lint
      - name: axe over rendered output
        run: pnpm test

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - run: cargo doc --workspace --all-features --no-deps

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-deny --locked
      - run: cargo deny check bans licenses sources

  # docs/16-DOCUMENTATION-MAINTENANCE.md — the design record is the source of
  # truth, so a broken cross-reference is a build failure.
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Internal documentation links resolve
        run: python3 scripts/check-doc-links.py

      - name: No leaked credentials (docs/40 §Tokens)
        # The tf_pat_/tf_sat_ prefix exists so a leak is detectable. It was
        # documented and produced nowhere until the prefixes landed; this is the
        # half that makes it worth anything. A token in a commit survives in the
        # history and in every clone, so the only cheap moment is before it lands.
        run: ./scripts/verify-no-secrets.sh

      - name: README phase progress matches the execution tracker
        # Derived, not typed. A percentage in a second place has no reason to
        # change when the tracker does, which is exactly how the status badge
        # went a week out of date.
        run: python3 scripts/phase-progress.py --check
      - name: Reject merge-conflict markers
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- ':!*.yml' ; then
            echo "merge-conflict markers found" >&2
            exit 1
          fi
      - name: Reject banned words in docs
        run: |
          # docs/16 §Writing standards — each hides an unverified claim.
          # The three docs that *define* the ban are excluded, as is the
          # archive, which is preserved verbatim for provenance.
          if git grep -nEi '\b(seamless|lossless)\b' -- 'docs/*.md' \
               ':!docs/10-PROJECT-GOAL-AND-STANDARDS.md' \
               ':!docs/16-DOCUMENTATION-MAINTENANCE.md' \
               ':!docs/17-GLOSSARY.md' \
               ':!docs/_archive/*' ; then
            echo "banned word in docs (docs/16 §Writing standards)" >&2
            exit 1
          fi

  # The deployable artifact. Built on every PR so a Dockerfile or dependency
  # change cannot rot unnoticed, and so the image size stays visible against the
  # <100 MB target (docs/30). Publishing happens on release, not here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t taskforge:ci .
      - name: Binaries run, migrations shipped, non-root
        # --version, not a bare invocation. This step used to run each binary
        # with no arguments and require exit 0, which passed only because they
        # were scaffolds that printed a line and stopped. The API is a real
        # server now: started with no configuration it refuses, exits 1, and is
        # RIGHT to — so the old check failed on correct behaviour.
        #
        # What this step actually wants to know is whether the binary executes
        # in this image: right architecture, libraries present, not a broken
        # link. --version answers exactly that and nothing else.
        run: |
          docker run --rm --entrypoint /usr/local/bin/taskforge-api    taskforge:ci --version
          docker run --rm --entrypoint /usr/local/bin/taskforge-worker taskforge:ci --version

      - name: The API refuses to start unconfigured (docs/48)
        # The behaviour that broke the check above is now asserted, not merely
        # tolerated. docs/48: "startup validation fails fast and specifically" —
        # a server that starts with no TF_SECRET_KEY has a CSRF binding that
        # proves nothing, and one that starts with TF_ATTACHMENT_ORIGIN equal to
        # TF_PUBLIC_URL serves user-uploaded HTML in the application's origin.
        run: |
          set +e
          output=$(docker run --rm --entrypoint /usr/local/bin/taskforge-api taskforge:ci 2>&1)
          status=$?
          set -e
          test "$status" -ne 0 || { echo "the API started with no configuration"; exit 1; }
          echo "$output" | grep -q "TF_SECRET_KEY" || {
            echo "it refused, but did not name the missing variable:"; echo "$output"; exit 1; }
          echo "  refuses unconfigured, and names TF_SECRET_KEY"
          test "$(docker inspect -f '{{.Config.User}}' taskforge:ci)" = "65532:65532"
          docker run --rm --entrypoint /usr/local/bin/taskforge-api taskforge:ci --help >/dev/null 2>&1 || true
      - name: Image size within budget (docs/30 — under 100 MB)
        run: |
          BYTES=$(docker image inspect taskforge:ci -f '{{.Size}}')
          MB=$((BYTES / 1000000))
          echo "image size: ${MB} MB"
          if [ "$MB" -gt 100 ]; then echo "image exceeds the 100 MB budget" >&2; exit 1; fi
      - name: Deployment compose files are valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config >/dev/null
          docker compose -f docker-compose.yml config >/dev/null
          rm deploy/.env
      # `config` above proves the dev file parses. It does not prove the profile
      # starts, and it cannot see a service leaking out of `--profile full` into
      # the default — which is the invariant that keeps docs/48 §Profile 1 a
      # supported target rather than an aspiration (F-010).
      - name: The developer profile is PostgreSQL and nothing else
        run: ./scripts/verify-dev-profile.sh
      - name: Deployment is actually secure end-to-end
        # Brings up the deployment compose and asserts the application role is
        # created NOSUPERUSER/NOBYPASSRLS, RLS covers every tenant table, an
        # unscoped connection sees nothing, and audit history rejects UPDATE.
        # These failures are silent in production, which is why they are gated.
        run: ./scripts/verify-deployment.sh

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            toolchain: "1.96.0"
          - os: ubuntu-latest
            toolchain: "1.88.0"   # the MSRV itself (ADR-031), not a number near it
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: rustup override set ${{ matrix.toolchain }}
      - run: cargo test --workspace --all-features --locked
