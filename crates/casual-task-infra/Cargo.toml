[package]
name = "casual-task-infra"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
casual-task-model = { workspace = true }
lettre = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
# `sync` for the broadcast hub, `fs`/`io-util` for the filesystem object store.
# Still no scheduler: this crate's job is adapters, and taking the whole of
# tokio here would put one in it.
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
