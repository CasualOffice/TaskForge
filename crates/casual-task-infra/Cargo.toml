[package]
name = "casual-task-infra"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
casual-task-model = { workspace = true }
lettre = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
# `sync` only: this crate needs mpsc for the broadcast hub and nothing else from
# the runtime. Taking the whole of tokio here would put a scheduler in a crate
# whose job is adapters.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
