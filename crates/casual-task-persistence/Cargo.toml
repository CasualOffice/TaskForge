[package]
name = "casual-task-persistence"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Off by default: a release build must not contain `expire_all_claims`.
test-support = []

[dependencies]
sqlx = { workspace = true, features = ["time"] }
casual-task-model = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
casual-task-search = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Tests only. The bootstrap's claim is not "rows were written" but "the resolver
# accepts them as authority", and the only honest way to assert that is to ask
# the real resolver. It is a dev-dependency so the production dependency graph
# docs/19 fixes is unchanged: persistence still does not consult authz.
casual-task-authz = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
casual-task-persistence = { path = ".", features = ["test-support"] }
tokio = { workspace = true }
sqlx = { workspace = true }
casual-task-identity = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
anyhow = { workspace = true }
