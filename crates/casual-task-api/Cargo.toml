[package]
name = "casual-task-api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
casual-task-model = { workspace = true }
casual-task-app = { workspace = true }
casual-task-persistence = { workspace = true }
casual-task-search = { workspace = true }
casual-task-infra = { workspace = true }
casual-task-observability = { workspace = true }
# Profile 1 runs the dispatch loop inside this process (`docs/48`,
# TF_WORKER_EMBEDDED). The worker's lib docs already anticipated this: "the API
# process calls dispatcher::run directly rather than shelling out to a binary."
casual-task-worker = { workspace = true }
tracing = { workspace = true }
casual-task-plugin-contract = { workspace = true }
casual-task-identity = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
# The Stream trait alone, to hand a subscription to axum's Sse. futures-util
# would bring combinators this crate has no use for.
futures-core = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
axum = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true, features = ["util"] }
casual-task-observability = { workspace = true }
casual-task-identity = { workspace = true }
casual-task-persistence = { workspace = true, features = ["test-support"] }
casual-task-infra = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
