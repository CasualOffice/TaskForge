# TaskForge — self-hosted single-node deployment.
# See docs/52-DEPLOYMENT-GUIDE.md for the walkthrough and docs/48 for the
# architecture behind these choices.
#
#   cp deploy/.env.example deploy/.env    # then EDIT IT — it will not start otherwise
#   docker compose -f deploy/docker-compose.yml up -d
#
# This is Profile 1 from docs/48: one binary plus PostgreSQL. No Redis, no S3,
# no separate worker process. Those are opt-in, and keeping this profile real is
# a design constraint on the whole architecture, not a convenience.

name: taskforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskforge}
      # Consumed by init-app-role.sh below. Required here, not only on the api
      # service: without it the init script fails, PostgreSQL leaves a data
      # directory behind, and the NEXT start skips initialization and comes up
      # healthy with no application role — at which point the app connects as
      # the owner and RLS is silently inert. Failing at `up` is the point.
      TASKFORGE_DB_PASSWORD: ${TASKFORGE_DB_PASSWORD:?set TASKFORGE_DB_PASSWORD in .env}
      # Same reasoning, second role: the dispatcher bypasses RLS, so it is a
      # separate credential rather than a capability added to the one above.
      TASKFORGE_DISPATCHER_PASSWORD: ${TASKFORGE_DISPATCHER_PASSWORD:?set TASKFORGE_DISPATCHER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on an empty data directory: creates the non-superuser
      # application role and the dispatcher. Without it the app connects as the
      # owner, and a superuser bypasses RLS unconditionally — tenant isolation
      # and append-only history would both be inert (migration 0012).
      - ./init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
      # Applies migrations/*.sql as the OWNER, once, after the roles above.
      # Nothing did this before: the stack came up with an empty database, an
      # API whose /health/ready passed (it is `SELECT 1`), and a 500 on the
      # first real request. docs/52 §Roles already said the owner runs
      # migrations; this is the step that does it.
      #
      # 20 after 10 is load-bearing: migrations 0012 and 0014 GRANT to the roles
      # the first script creates.
      - ./apply-migrations.sh:/docker-entrypoint-initdb.d/20-apply-migrations.sh:ro
      - ../migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published. Nothing outside this network needs the database.
    expose: ["5432"]

  api:
    # Two ways to get the binary, and the default is the published image.
    #
    #   docker compose -f deploy/docker-compose.yml up -d
    #       pulls ghcr.io/casualoffice/taskforge:latest
    #
    #   docker compose -f deploy/docker-compose.yml --profile build up -d --build
    #       builds this repository instead, from the Dockerfile at its root
    #
    # `build` is declared beside `image` rather than replacing it: with both,
    # `--build` builds and tags locally while a plain `up` still pulls. A
    # compose file that could only build would make every deployment compile
    # Rust; one that could only pull would make the source unrunnable without
    # publishing it first.
    image: ${TASKFORGE_IMAGE:-ghcr.io/casualoffice/taskforge:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Connects as taskforge_app — NOT the owner. This is what makes RLS and
      # append-only history actually enforce anything.
      DATABASE_URL: postgres://taskforge_app:${TASKFORGE_DB_PASSWORD:?set TASKFORGE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskforge}
      TF_BIND_ADDR: 0.0.0.0:8080
      TF_PUBLIC_URL: ${TF_PUBLIC_URL:?set TF_PUBLIC_URL}
      # MUST differ from TF_PUBLIC_URL. A shared origin means a stored HTML or
      # SVG attachment executes in the application's origin (docs/28).
      TF_ATTACHMENT_ORIGIN: ${TF_ATTACHMENT_ORIGIN:?set TF_ATTACHMENT_ORIGIN}
      TF_SECRET_KEY: ${TF_SECRET_KEY:?set TF_SECRET_KEY}
      TF_STORAGE_BACKEND: fs
      TF_STORAGE_PATH: /data/attachments
      # The embedded worker dispatches as taskforge_dispatcher, not as the role
      # serving requests. Same process, different connection — the capability to
      # read across tenants belongs to the loop, not to the API.
      DISPATCHER_DATABASE_URL: postgres://taskforge_dispatcher:${TASKFORGE_DISPATCHER_PASSWORD:?set TASKFORGE_DISPATCHER_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskforge}
      TF_WORKER_EMBEDDED: "true"
      TF_LOG_FORMAT: json
      # docs/48 §Configuration declares TF_SMTP_* as "host, port, user, pass,
      # from". User and pass were declared there and passed nowhere, so an
      # operator following the deployment guide could only reach a relay that
      # accepts anonymous mail — which is close to none of them.
      TF_SMTP_HOST: ${TF_SMTP_HOST:-}
      TF_SMTP_PORT: ${TF_SMTP_PORT:-587}
      TF_SMTP_USER: ${TF_SMTP_USER:-}
      TF_SMTP_PASS: ${TF_SMTP_PASS:-}
      TF_SMTP_FROM: ${TF_SMTP_FROM:-}
      # Malware scanning (docs/28 step 4). **This is the switch.**
      #
      # Set, an upload is scanned and — if clean — becomes visible. Unset,
      # nothing ever marks an attachment clean, and `committed_at` stays NULL,
      # and every read of an attachment requires it: files upload successfully
      # and are never listed or downloadable.
      #
      # That is D-062, countersigned, and it is deliberate: the alternative
      # default is a deployment that serves unscanned user content while
      # appearing to work. Turning scanning *off* is allowed; making an absent
      # scanner mean "clean" is not.
      #
      # `clamav:3310` is the service below. Bring it up with:
      #     docker compose --profile scanning up -d
      TF_CLAMD_ADDR: ${TF_CLAMD_ADDR:-}
      # Where the browser reaches this deployment. Used in emails and OIDC
      # redirects, and — since C-040 — as the one origin the attachment origin
      # accepts uploads from.
    volumes:
      - attachments:/data/attachments
    ports:
      - "${TF_HTTP_PORT:-8080}:8080"
    healthcheck:
      # /health/live must not touch the database: a liveness probe that fails
      # during a database blip restarts every healthy instance at once and turns
      # a partial outage into a total one (docs/46).
      #
      # `--health-check` short-circuits before telemetry and opens a socket to
      # the configured bind address. It used to ignore every argument and
      # therefore always pass, which is the worse failure: an unhealthy service
      # reported as healthy forever.
      test: ["CMD", "/usr/local/bin/taskforge-api", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  # Opt-in, behind a profile: the image is ~1 GB and loads a signature database
  # on start, which is a cost no deployment should pay by accident. A profile
  # rather than a commented-out block, because a service you have to uncomment
  # is one nobody can enable from configuration alone.
  #
  #     docker compose --profile scanning up -d
  #     TF_CLAMD_ADDR=clamav:3310
  #
  # Both are needed and they are separate on purpose: running the daemon and
  # pointing the application at it are two decisions, and an operator who does
  # the first without the second gets a warning in the log rather than silent
  # non-scanning.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scanning"]
    restart: unless-stopped
    environment:
      # Refresh signatures on start as well as on schedule. A container that
      # comes up with a database from image-build time is a scanner that misses
      # everything found since.
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamdb:/var/lib/clamav
    expose: ["3310"]
    healthcheck:
      # `clamdcheck.sh` asks the daemon itself, which is what the application
      # will do. A TCP probe would pass while the signature database is still
      # loading, and a scan against a half-loaded database is worse than none.
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Loading the database takes minutes on a cold volume, and a scanner
      # marked unhealthy in that window would restart forever.
      start_period: 300s
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  # The signature database. A named volume so `freshclam` does not re-download
  # ~1 GB on every restart.
  clamdb:
  attachments:
