<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskForge</title>
    <!-- Both, so the browser paints form controls and scrollbars in the right
         theme before any script runs. `shell/theme.ts` narrows it to one by
         stamping `data-theme` on the root element. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The mark, not a letterform in a rounded square: VISUAL-IDENTITY §3
         rules that out explicitly. The favicon asset is the simplified one —
         §8 removes fine detail and thickens the stroke at 32 px, so the general
         mark would turn to mud in a tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#D8610B" />
    <meta name="description" content="TaskForge — structured work, shaped into an outcome." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
