# Compile-time enforcement of the invariants docs/24 §Backpressure and docs/30
# §Anti-patterns commit to.
#
# WHY THIS FILE EXISTS ALONGSIDE tools/casual-task-lint
#
# The custom lint checks source text: it greps for `unbounded_channel` and
# `channel::unbounded`. That catches the two spellings someone thought of, and
# misses `flume::unbounded()`, `async_channel::unbounded()`,
# `futures::channel::mpsc::unbounded()`, `std::sync::mpsc::channel()` (unbounded
# by definition), and any call split across two lines. A rule that is one rename
# away from silence is not a gate.
#
# `disallowed-methods` resolves real paths after name resolution, so an alias, a
# re-export, or a line break cannot evade it. AGENTS.md: make the wrong thing
# impossible, not discouraged.
#
# NOTE ON UNRESOLVED PATHS
#
# Most of the crates below are not workspace dependencies yet — no async runtime
# exists at Phase 0 (docs/14). Clippy ignores a disallowed path it cannot
# resolve, so these entries sit dormant and begin enforcing the moment the
# dependency is added, which is exactly when they are needed. They are written
# now because adding them after the first unbounded channel ships is too late.

disallowed-methods = [
    # ── Unbounded queues (docs/24 §Backpressure: "all queues are bounded") ───
    # An unbounded channel does not remove backpressure, it defers it into an
    # out-of-memory crash under exactly the load where it hurts most.
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "unbounded queue — docs/24 §Backpressure requires a bounded channel; use tokio::sync::mpsc::channel(n)" },
    { path = "futures::channel::mpsc::unbounded", reason = "unbounded queue — docs/24 §Backpressure; use futures::channel::mpsc::channel(n)" },
    { path = "futures_channel::mpsc::unbounded", reason = "unbounded queue — docs/24 §Backpressure; use futures_channel::mpsc::channel(n)" },
    { path = "crossbeam_channel::unbounded", reason = "unbounded queue — docs/24 §Backpressure; use crossbeam_channel::bounded(n)" },
    { path = "flume::unbounded", reason = "unbounded queue — docs/24 §Backpressure; use flume::bounded(n)" },
    { path = "async_channel::unbounded", reason = "unbounded queue — docs/24 §Backpressure; use async_channel::bounded(n)" },
    { path = "std::sync::mpsc::channel", reason = "std's mpsc::channel is unbounded — docs/24 §Backpressure; use std::sync::mpsc::sync_channel(n)" },

    # ── NOT BANNED HERE: blocking-inside-async ───────────────────────────────
    #
    # `std::thread::sleep` and `Runtime::block_on` were both banned here and
    # both have been removed, because a path cannot express the hazard.
    # `block_on` is what `#[tokio::test]` and `main` legitimately do; sleeping
    # is what a synchronous CLI does. The same path is correct outside a
    # runtime and wrong inside one, and clippy sees only the path.
    #
    # Two false positives in one day made the cost concrete: an allow in
    # tools/casual-task-loadtest/src/db.rs, and every `#[tokio::test]` in
    # crates/casual-task-persistence. Phase 1 would add one suppression per
    # async test — and `#[allow(clippy::disallowed_methods)]` is not selective,
    # so each of those would ALSO switch off the unbounded-queue checks in that
    # file. A ban that has to be suppressed everywhere protects nothing and
    # takes the working rules down with it.
    #
    # The hazard is real and is caught elsewhere: tokio panics at runtime on
    # `block_on` inside a runtime, and docs/30 §Anti-patterns already assigns
    # blocking-in-async to a `tokio-console` check rather than a lint.
]

disallowed-types = [
    { path = "tokio::sync::mpsc::UnboundedSender", reason = "unbounded queue — docs/24 §Backpressure" },
    { path = "tokio::sync::mpsc::UnboundedReceiver", reason = "unbounded queue — docs/24 §Backpressure" },
    { path = "futures::channel::mpsc::UnboundedSender", reason = "unbounded queue — docs/24 §Backpressure" },
    { path = "futures::channel::mpsc::UnboundedReceiver", reason = "unbounded queue — docs/24 §Backpressure" },
]
